kind = "web"
previewPath = "/"
title = "MAD MAX"
description = "MAD MAX is a premium movie review and discovery platform — a modern, cinematic alternative to IMDB. It combines a rich movie database (powered by TMDB), text and video reviews, a social follow feed, personalized recommendations, OTT streaming links, and an industry professional networking section for actors, directors, and crew."
version = "1.0.0"
id = "artifacts/mad-max"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22520
dependsOn = ["artifacts/api-server: API Server"]

[services.development]
run = "pnpm --filter @workspace/mad-max run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mad-max", "run", "build" ]
serve = "static"
publicDir = "artifacts/mad-max/dist/public"

[[services.production.rewrites]]
from = "/movies/*"
to = "/movies/*/index.html"

[[services.production.rewrites]]
from = "/blog/movies/*"
to = "/blog/movies/*/index.html"

[[services.production.rewrites]]
from = "/actors/*"
to = "/actors/*/index.html"

[[services.production.rewrites]]
from = "/genre/*"
to = "/genre/*/index.html"

[[services.production.rewrites]]
from = "/anime"
to = "/anime/index.html"

[[services.production.rewrites]]
from = "/free-classics"
to = "/free-classics/index.html"

[[services.production.rewrites]]
from = "/free-classics/*"
to = "/free-classics/*/index.html"

[[services.production.rewrites]]
from = "/discover"
to = "/discover/index.html"

[[services.production.rewrites]]
from = "/actors"
to = "/actors/index.html"

[[services.production.rewrites]]
from = "/genres"
to = "/genres/index.html"

[[services.production.rewrites]]
from = "/news"
to = "/news/index.html"

[[services.production.rewrites]]
from = "/free-movies"
to = "/free-movies/index.html"

[[services.production.rewrites]]
from = "/browse"
to = "/browse/index.html"

[[services.production.rewrites]]
from = "/events"
to = "/events/index.html"

[[services.production.rewrites]]
from = "/pricing"
to = "/pricing/index.html"

[[services.production.rewrites]]
from = "/help"
to = "/help/index.html"

[[services.production.rewrites]]
from = "/site-index"
to = "/site-index/index.html"

[[services.production.rewrites]]
