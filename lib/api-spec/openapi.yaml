components:
  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ProfileIdQuery:
      name: profileId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    PostId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  schemas:
    PostAuthor:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        authorType:
          type: string
          enum: [user, actor]
        verified:
          type: boolean
      required: [id, displayName, avatarUrl, authorType, verified]

    Post:
      type: object
      properties:
        id:
          type: integer
        author:
          $ref: "#/components/schemas/PostAuthor"
        content:
          type: string
        imageUrl:
          type: ["string", "null"]
        imageType:
          type: ["string", "null"]
        linkedMovieId:
          type: ["integer", "null"]
        linkedMovieTitle:
          type: ["string", "null"]
        linkedMoviePosterPath:
          type: ["string", "null"]
        postType:
          type: string
          enum: [standard, announcement]
        likesCount:
          type: integer
        commentsCount:
          type: integer
        viewerLiked:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - author
        - content
        - imageUrl
        - imageType
        - linkedMovieId
        - linkedMovieTitle
        - linkedMoviePosterPath
        - postType
        - likesCount
        - commentsCount
        - viewerLiked
        - createdAt

    PostFeedResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        nextCursor:
          type: ["string", "null"]
        hasMore:
          type: boolean
      required: [items, nextCursor, hasMore]

    PostInput:
      type: object
      properties:
        content:
          type: string
          maxLength: 500
        imageUrl:
          type: ["string", "null"]
        imageType:
          type: ["string", "null"]
        imageName:
          type: ["string", "null"]
        imageSize:
          type: ["integer", "null"]
        linkedMovieId:
          type: ["integer", "null"]
        linkedMovieTitle:
          type: ["string", "null"]
        linkedMoviePosterPath:
          type: ["string", "null"]
        postType:
          type: string
          enum: [standard, announcement]
      required: [content]

    PostUploadInput:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
      required: [name, size, contentType]

    PostUploadResponse:
      type: object
      properties:
        uploadURL:
          type: string
          format: uri
        imageUrl:
          type: string
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string
      required: [uploadURL, imageUrl, name, size, contentType]

    PostLikeResponse:
      type: object
      properties:
        liked:
          type: boolean
        likesCount:
          type: integer
      required: [liked, likesCount]

    PostComment:
      type: object
      properties:
        id:
          type: integer
        postId:
          type: integer
        userId:
          type: string
        author:
          $ref: "#/components/schemas/PostAuthor"
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, postId, userId, author, content, createdAt]

    PostCommentInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 500
      required: [content]

    Story:
      type: object
      properties:
        id:
          type: integer
        author:
          $ref: "#/components/schemas/PostAuthor"
        content:
          type: string
        mediaUrl:
          type: ["string", "null"]
        mediaType:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        isOwner:
          type: boolean
      required: [id, author, content, mediaUrl, mediaType, createdAt, expiresAt, isOwner]

    StoryInput:
      type: object
      properties:
        content:
          type: string
          maxLength: 280
        mediaUrl:
          type: ["string", "null"]
        mediaType:
          type: ["string", "null"]
        mediaName:
          type: ["string", "null"]
        mediaSize:
          type: ["integer", "null"]

    StoryUploadInput:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
